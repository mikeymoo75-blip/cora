# Add inside the existing datosfarm.com server block (nginx).
# Leaves the gym scheduler at / untouched.

location = /cora {
	return 301 /cora/;
}

location /cora/ {
	proxy_pass http://127.0.0.1:43148/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Prefix /cora;
}
