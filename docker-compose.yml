services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DOCKER: "1"
      HOSTNAME: 0.0.0.0
      PORT: "8080"
      TZ: America/New_York
    expose:
      - "8080"

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./deploy/origin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:43148:80"
