services:
  cora:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DOCKER: "1"
      HOSTNAME: 0.0.0.0
      PORT: "8080"
      TZ: America/New_York
    expose:
      - "8080"
    networks:
      - default
      - gym

  cora-proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - cora
    volumes:
      - ./deploy/origin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:43148:80"
    networks:
      - default
      - gym

networks:
  gym:
    name: mp-basketball_default
    external: true
